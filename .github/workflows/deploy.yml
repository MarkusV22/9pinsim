# Veröffentlicht 9PinSim auf Cloudflare bei jedem Push auf main.
# Benötigte Repository-Secrets (gleiche Werte wie bei 9pinfantasy): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional für die Google-Anmeldung: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
name: Veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Datenbank anlegen
        run: node scripts/ci-provision.mjs
      - name: Datenbank-Schema aktualisieren
        run: npx --yes wrangler@4 d1 migrations apply 9pinsim --remote
      - name: Veröffentlichen
        run: npx --yes wrangler@4 deploy
      - name: Google-Schlüssel setzen
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_ID
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_SECRET
          else
            echo "Google-Anmeldung noch nicht eingerichtet (Secrets fehlen)"
          fi
